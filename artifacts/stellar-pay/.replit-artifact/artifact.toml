kind = "web"
previewPath = "/"
title = "Stellar Pay"
version = "1.0.0"
id = "artifacts/stellar-pay"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23936

[services.development]
run = "pnpm --filter @workspace/stellar-pay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stellar-pay", "run", "build" ]
publicDir = "artifacts/stellar-pay/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23936"
BASE_PATH = "/"
